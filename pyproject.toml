[project]
name = "pyspeed"
version = "0.1.0"
description = "Python performance experiments and optimization examples"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "numba>=0.61,<1.0",
    "opencv-python-headless>=4.10,<5.0",
    "Pillow>=11.0,<12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["pyspeed"]
